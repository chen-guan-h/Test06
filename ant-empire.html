<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1c120a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>蟻國崛起</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@500;700;900&family=Noto+Serif+TC:wght@700;900&display=swap">
<style>
/* 介面：地底泥土與琥珀樹脂。深褐面板、琥珀色重點、戰記般的襯線大字 */
:root {
  --soil: #1c120a; --soil-2: #2e1d10; --panel: rgba(28,18,10,0.92); --line: rgba(232,163,61,0.35);
  --amber: #e8a33d; --amber-2: #ffcf6a; --chitin: #b3261e; --leaf: #7aa848; --bone: #f4e8d0; --muted: #c4b294;
  --sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; --serif: "Noto Serif TC", "Songti TC", serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { height: 100%; background: var(--soil); box-sizing: border-box; }
*, *::before, *::after { box-sizing: inherit; }
body { margin: 0; height: 100%; overflow: hidden; background: var(--soil); color: var(--bone); font: 14px/1.45 var(--sans); user-select: none; -webkit-user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
button, input { font-family: inherit; color: inherit; }
button { cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 2px solid var(--amber-2); outline-offset: 2px; }
#cv { position: fixed; inset: 0; display: block; width: 100%; height: 100%; }
.btn { border: 1px solid rgba(232,163,61,0.45); background: linear-gradient(#4a3020, #2e1d10); color: var(--bone); padding: 8px 14px; border-radius: 10px; font-weight: 700; font-size: 14px; box-shadow: inset 0 1px 0 rgba(255,220,160,0.15), 0 2px 0 rgba(0,0,0,0.5); white-space: nowrap; }
.btn:hover { filter: brightness(1.15); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.38; cursor: default; filter: none; }
.btn.gold { background: linear-gradient(#ffd27a, #d98a2a); color: #2a1404; border-color: #ffe8b0; }
.dim { color: var(--muted); }
.hot { color: var(--amber-2); }
kbd { display: inline-block; min-width: 20px; padding: 0 5px; margin: 0 1px; border-radius: 5px; background: var(--bone); color: #2a1404; font: 700 12px/18px var(--sans); text-align: center; box-shadow: 0 2px 0 #8a6a40; }

/* ---------- 標題 ---------- */
#title { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 20px; background: radial-gradient(ellipse at 50% 60%, rgba(20,10,4,0.25), rgba(20,10,4,0.75)); touch-action: pan-y; overflow-y: auto; }
.logo { margin: 0; text-align: center; font: 900 clamp(52px, 11vw, 120px)/1 var(--serif); letter-spacing: .08em; color: #2a1404; -webkit-text-stroke: 0; background: linear-gradient(#fff2c0, #e8a33d 45%, #9a3a10); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #1a0a04) drop-shadow(0 10px 20px rgba(0,0,0,0.6)); }
.tagline { margin: -6px 0 0; font: 700 clamp(14px, 2.2vw, 18px)/1.5 var(--serif); color: var(--bone); text-shadow: 0 2px 6px #000; text-align: center; max-width: 34em; }
.tbtns { display: flex; flex-direction: column; gap: 10px; width: min(340px, 90vw); }
.tbtns .btn { padding: 13px 18px; font-size: 17px; display: flex; flex-direction: column; align-items: center; }
.tbtns .btn small { font-size: 12px; font-weight: 500; opacity: 0.8; }
#t-helpbox { width: min(560px, 92vw); background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; font-size: 13px; }
#t-helpbox p { margin: 4px 0; }

/* ---------- HUD ---------- */
#hud { position: fixed; inset: 0; pointer-events: none; }
#hud > * { pointer-events: auto; }
#res { position: absolute; left: max(10px, env(safe-area-inset-left)); top: max(8px, env(safe-area-inset-top)); display: grid; grid-template-columns: auto auto; gap: 3px 12px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-weight: 700; }
#res .rv { display: flex; align-items: baseline; gap: 4px; white-space: nowrap; }
#res small { color: var(--muted); font-weight: 500; }
.foodbar { grid-column: 1 / -1; height: 4px; border-radius: 2px; background: rgba(0,0,0,0.5); overflow: hidden; }
.foodbar i { display: block; height: 100%; background: var(--amber); }
#r-queenw { grid-column: 1 / -1; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
#r-queenw .qb { flex: 1; height: 5px; border-radius: 3px; background: rgba(0,0,0,0.5); overflow: hidden; }
#r-queenw .qb i { display: block; height: 100%; background: #d84a30; }
#r-queenw.danger { color: #ff8a6a; animation: blink 0.8s infinite; }
@keyframes blink { 50% { opacity: 0.5; } }
#ribbonw { position: absolute; left: 50%; transform: translateX(-50%); top: max(8px, env(safe-area-inset-top)); width: min(640px, 46vw); }
#ribbon { width: 100%; height: 58px; display: block; cursor: crosshair; }
#clock { position: absolute; right: max(10px, env(safe-area-inset-right)); top: max(8px, env(safe-area-inset-top)); display: flex; flex-direction: column; align-items: flex-end; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; font-size: 12px; }
#clock b { font: 900 16px var(--serif); color: var(--amber-2); }
#topbtns { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 54px); display: flex; gap: 6px; }
#topbtns .btn { padding: 7px 11px; position: relative; }
.dot::after { content: ""; position: absolute; right: -3px; top: -3px; width: 10px; height: 10px; border-radius: 50%; background: #ff4a2a; box-shadow: 0 0 0 2px var(--soil); }
#savemark { position: absolute; right: max(10px, env(safe-area-inset-right)); top: calc(max(8px, env(safe-area-inset-top)) + 96px); font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 9px; background: var(--panel); opacity: 0; transition: opacity .3s; pointer-events: none; }
#savemark.on { opacity: 1; }
#log { position: absolute; left: max(10px, env(safe-area-inset-left)); top: 136px; display: flex; flex-direction: column; gap: 3px; pointer-events: none; max-width: min(420px, 50vw); }
.lg { font-size: 13px; font-weight: 700; text-shadow: 0 1px 3px #000, 0 0 2px #000; transition: opacity .6s; }
.lg.out { opacity: 0; }
#raidarrow { position: absolute; top: 46%; font: 900 22px var(--serif); color: #ff6a4a; text-shadow: 0 2px 6px #000; opacity: 0; pointer-events: none; transition: opacity .3s; }
#raidarrow.left { left: 14px; } #raidarrow.right { right: 14px; }
#raidarrow.on { opacity: 1; animation: blink 0.6s infinite; }
#player { position: absolute; left: max(10px, env(safe-area-inset-left)); bottom: max(10px, env(safe-area-inset-bottom)); width: 260px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
#player .ph { display: flex; justify-content: space-between; align-items: baseline; }
#p-stage { font: 900 17px var(--serif); color: var(--amber-2); }
.bar2 { position: relative; height: 12px; margin-top: 5px; border-radius: 6px; background: rgba(0,0,0,0.55); overflow: hidden; }
.bar2 i { position: absolute; left: 0; top: 0; bottom: 0; transition: width .15s; }
.bar2 span { position: absolute; inset: 0; text-align: center; font-size: 10px; line-height: 12px; font-weight: 900; text-shadow: 0 1px 2px #000; }
#p-hp { background: linear-gradient(#ff7a5a, #b8261a); }
.xpbar { height: 5px; } #p-xp { background: var(--amber-2); }
.furybar { height: 7px; } #p-fury { background: linear-gradient(90deg, #ff5a1a, #ffd040); }
#cmd { position: absolute; left: 50%; transform: translateX(-50%); bottom: max(10px, env(safe-area-inset-bottom)); display: flex; gap: 6px; align-items: center; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
#cmd .btn { padding: 7px 12px; }
#cmd .btn.on { background: linear-gradient(#ffd27a, #d98a2a); color: #2a1404; }
#cmd .army { font: 900 14px var(--serif); color: var(--amber-2); padding: 0 6px; white-space: nowrap; }
#skills { position: absolute; right: max(10px, env(safe-area-inset-right)); bottom: max(10px, env(safe-area-inset-bottom)); display: grid; grid-template-columns: repeat(4, 52px); gap: 6px; }
.sk { position: relative; width: 52px; height: 52px; border-radius: 12px; border: 1px solid rgba(232,163,61,0.55); background: linear-gradient(#5a3a22, #2e1d10); padding: 0; overflow: hidden; --cd: 0deg; }
.sk::before { content: ""; position: absolute; inset: 0; background: conic-gradient(rgba(0,0,0,0.7) var(--cd), transparent var(--cd)); }
.sk .n { position: relative; font: 900 15px var(--serif); color: var(--amber-2); }
.sk .k { position: absolute; left: 4px; top: 1px; font-size: 10px; font-weight: 900; color: var(--bone); }
.sk.locked { opacity: 0.35; }
.b-frenzy { background: linear-gradient(#5a2010, #2e0d08); }
.b-frenzy.ready { background: linear-gradient(#ff8a3a, #c0200a); animation: pulse 0.8s infinite; }
.b-frenzy.active { background: linear-gradient(#ff3a1a, #8a0a04); }
@keyframes pulse { 50% { box-shadow: 0 0 18px #ff6a1a; } }
#toast { position: fixed; left: 50%; top: 30%; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px; background: rgba(28,18,10,0.92); border: 1px solid var(--line); font-weight: 700; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 60; }
#toast.on { opacity: 1; }

/* ---------- 面板 ---------- */
#panel { position: fixed; right: 0; top: 0; bottom: 0; width: min(560px, 100vw); background: linear-gradient(90deg, rgba(20,12,6,0.96), rgba(28,18,10,0.98)); border-left: 2px solid #6a4420; display: flex; flex-direction: column; z-index: 40; box-shadow: -10px 0 40px rgba(0,0,0,0.5); }
.phead { display: flex; align-items: center; gap: 6px; padding: max(10px, env(safe-area-inset-top)) 10px 8px 14px; border-bottom: 1px solid var(--line); }
.phead h3 { margin: 0 auto 0 0; font: 900 20px var(--serif); color: var(--amber-2); }
.phead .paused { font-size: 11px; color: var(--muted); }
#ptabs { display: flex; gap: 4px; padding: 8px 10px; }
#ptabs button { flex: 1; padding: 8px 4px; border-radius: 9px; border: 1px solid var(--line); background: rgba(0,0,0,0.3); color: var(--muted); font-weight: 700; }
#ptabs button.on { background: linear-gradient(#ffd27a, #d98a2a); color: #2a1404; }
#pclose { width: 36px; height: 36px; border-radius: 10px; border: none; background: rgba(0,0,0,0.35); font-size: 18px; }
#pbody { flex: 1; overflow-y: auto; padding: 4px 14px 20px; touch-action: pan-y; }
.lead { color: var(--muted); font-size: 13px; margin: 6px 0 10px; }
.lead b { color: var(--bone); }
h4 { margin: 14px 0 6px; font: 900 15px var(--serif); color: var(--amber-2); }
.rooms { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.room { text-align: left; display: grid; grid-template-columns: auto 1fr; gap: 0 8px; align-items: center; padding: 8px 10px; border-radius: 10px; border: 1px solid rgba(232,163,61,0.3); background: rgba(60,36,18,0.6); }
.room .ri { grid-row: span 2; font-size: 22px; }
.room small { color: var(--muted); font-size: 11px; line-height: 1.3; }
.room.empty { border-style: dashed; background: rgba(0,0,0,0.25); }
.room.sel { border-color: var(--amber-2); background: rgba(232,163,61,0.18); }
.room .bar { grid-column: 1 / -1; display: block; height: 4px; margin-top: 4px; background: rgba(0,0,0,0.5); border-radius: 2px; overflow: hidden; }
.room .bar i { display: block; height: 100%; background: var(--amber); }
.list { display: flex; flex-direction: column; gap: 6px; }
.row-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; background: rgba(60,36,18,0.55); border: 1px solid rgba(232,163,61,0.18); }
.row-item .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.row-item small { font-size: 12px; color: var(--muted); line-height: 1.35; }
.row-item .ri { font-size: 22px; }
.row-item.locked { opacity: 0.5; }
.row-item.maxed { opacity: 0.7; }
.cicon { width: 60px; height: 40px; flex: 0 0 auto; border-radius: 8px; background: radial-gradient(ellipse at 50% 70%, #c8a070, #6a4a2a 70%); }
.slider { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
.slider input { flex: 1; accent-color: var(--amber); }
.slider span { width: 2.2em; text-align: right; font-weight: 900; color: var(--amber-2); }
.brood-top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
.eggs { display: flex; flex-wrap: wrap; gap: 6px; }
.egg { position: relative; padding: 3px 9px; border-radius: 10px; background: rgba(244,232,208,0.15); font-size: 12px; overflow: hidden; }
.egg i { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--amber); }
.stats { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 12px; font-size: 13px; color: var(--muted); }
.stats b { color: var(--bone); }
.evo { display: flex; gap: 4px; margin-bottom: 10px; }
.evo span { flex: 1; text-align: center; padding: 5px 2px; border-radius: 8px; background: rgba(0,0,0,0.3); color: var(--muted); font: 700 12px var(--serif); display: flex; flex-direction: column; }
.evo span.on { background: linear-gradient(#6a3a14, #3a1e0a); color: var(--amber-2); }
.evo small { font: 500 10px var(--sans); }
.key { width: 28px; height: 28px; flex: 0 0 auto; display: grid; place-items: center; border-radius: 7px; background: var(--bone); color: #2a1404; font-weight: 900; }
.menu-btns { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
.help { font-size: 13px; }
.help p { margin: 4px 0; color: var(--muted); }

/* ---------- 結局 ---------- */
#over { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 20px; background: radial-gradient(ellipse at center, rgba(40,20,8,0.75), rgba(10,4,2,0.95)); }
#over.lose { background: radial-gradient(ellipse at center, rgba(40,6,4,0.8), rgba(8,2,2,0.96)); }
#o-title { margin: 0; font: 900 clamp(48px, 10vw, 96px)/1 var(--serif); background: linear-gradient(#fff2c0, #e8a33d 50%, #8a2a0a); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; filter: drop-shadow(0 4px 0 #000); }
#over.lose #o-title { background: linear-gradient(#ffb0a0, #b3261e 60%, #3a0604); -webkit-background-clip: text; background-clip: text; }
#o-sub { margin: 0; font: 700 17px var(--serif); color: var(--bone); }
#o-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; width: min(560px, 92vw); }
#o-stats div { display: flex; flex-direction: column; padding: 8px 12px; border-radius: 10px; background: rgba(0,0,0,0.4); border: 1px solid var(--line); }
#o-stats span { font-size: 12px; color: var(--muted); }
#o-stats b { font: 900 22px var(--serif); color: var(--amber-2); }

/* ---------- 觸控 ---------- */
#tc { display: none; }
body.touch #tc { display: block; }
body.touch #skills, body.touch #player { display: none; }
#pad { position: absolute; left: max(18px, env(safe-area-inset-left)); bottom: 22px; width: 132px; height: 132px; border-radius: 50%; background: radial-gradient(circle, rgba(255,230,180,0.1), rgba(255,230,180,0.03)); border: 2px solid rgba(255,230,180,0.25); touch-action: none; }
#knob { position: absolute; left: 50%; top: 50%; width: 58px; height: 58px; margin: -29px 0 0 -29px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, rgba(255,230,180,0.6), rgba(232,163,61,0.3)); border: 2px solid rgba(255,230,180,0.5); pointer-events: none; }
.tb { position: absolute; border-radius: 50%; border: 2px solid rgba(255,230,180,0.45); background: rgba(40,24,12,0.65); color: var(--bone); font: 900 16px var(--serif); padding: 0; touch-action: none; }
.tb.on { background: rgba(232,163,61,0.6); transform: scale(0.94); }
#t-atk { right: max(20px, env(safe-area-inset-right)); bottom: 26px; width: 90px; height: 90px; font-size: 22px; background: rgba(150,30,20,0.7); }
#t-jump { right: calc(max(20px, env(safe-area-inset-right)) + 100px); bottom: 16px; width: 64px; height: 64px; }
#tskills { position: absolute; right: max(20px, env(safe-area-inset-right)); bottom: 128px; display: flex; flex-wrap: wrap-reverse; justify-content: flex-end; gap: 6px; width: 240px; }
#tskills .sk { width: 50px; height: 50px; border-radius: 50%; }
#tstat { position: absolute; left: calc(max(18px, env(safe-area-inset-left)) + 146px); bottom: 14px; width: 170px; padding: 5px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
#tstat .bar2 { height: 9px; margin-top: 3px; }
#tstat .bar2 span { font-size: 8px; line-height: 9px; }
body.touch #cmd { bottom: auto; top: calc(max(8px, env(safe-area-inset-top)) + 66px); padding: 4px; }
body.touch #cmd .btn { padding: 5px 9px; font-size: 12px; }
body.touch #ribbon { height: 50px; }
body.touch #log { top: 120px; }
body.touch #res { font-size: 12px; padding: 5px 9px; }
@media (max-width: 900px) { #ribbonw { width: min(420px, 44vw); } #res { gap: 1px 8px; } }
@media (max-height: 430px) { #log { display: none; } body.touch #log { display: flex; top: 108px; } #clock { padding: 3px 8px; } #topbtns { top: 50px; } }
@media (prefers-reduced-motion: reduce) { #r-queenw.danger, #raidarrow.on, .b-frenzy.ready { animation: none; } }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<section id="title">
  <h1 class="logo">蟻國崛起</h1>
  <p class="tagline">從一窩螞蟻開始。啃食草原、吞沒池塘、攻陷人類的城市。<br>直到征服世界，或者滅亡。</p>
  <div class="tbtns">
    <button id="t-cont" class="btn gold" hidden>繼續蟻國<small id="t-contsub"></small></button>
    <button id="t-new" class="btn">建立新的蟻國</button>
    <button id="t-help" class="btn">玩法說明</button>
  </div>
  <div id="t-helpbox" hidden>
    <p><b>你是一隻會成長的螞蟻</b>，帶領整個蟻群擴張。殺敵升級、學習技能，從工蟻一路進化成蟻皇。</p>
    <p><b>蟻群會自己運作</b>：蟻后產卵、工蟻採集與搬運獵物屍體、兵蟻跟著你作戰。你可以挖巢室、調整繁殖比例、用 DNA 進化。</p>
    <p><b>征服</b>：向左是自然界、向右是人類世界，各四個區域。攻陷區域據點就能征服，八區全部征服即勝利；蟻后死亡即失敗。</p>
    <p>電腦：<kbd>A</kbd><kbd>D</kbd> 移動、<kbd>W</kbd> 跳、<kbd>J</kbd> 撕咬、<kbd>K</kbd>～<kbd>Y</kbd> 技能、<kbd>B</kbd> 蟻群面板。手機：左邊搖桿移動，右邊攻擊與技能。</p>
  </div>
</section>

<div id="hud" hidden>
  <div id="res">
    <div class="rv" title="食物">🍖 <span id="r-food"></span><small id="r-foodcap"></small></div>
    <div class="rv" title="DNA">🧬 <span id="r-dna"></span></div>
    <div class="foodbar"><i id="r-foodbar"></i></div>
    <div class="rv" title="族群">🐜 <span id="r-pop"></span><small id="r-popcap"></small></div>
    <div class="rv" title="孵化中的卵">🥚 <span id="r-eggs"></span></div>
    <div id="r-queenw">蟻后 <span class="qb"><i id="r-queen"></i></span></div>
  </div>
  <div id="ribbonw"><canvas id="ribbon" aria-label="領土圖：點一下設定軍團集結點"></canvas></div>
  <div id="clock"></div>
  <div id="topbtns"><button id="b-panel" class="btn">🐜 蟻群</button><button id="b-menu" class="btn">☰</button></div>
  <div id="savemark"></div>
  <div id="log"></div>
  <div id="raidarrow"></div>
  <div id="player">
    <div class="ph"><span id="p-stage"></span><b id="p-lv"></b></div>
    <div class="bar2"><i id="p-hp"></i><span id="p-hpt"></span></div>
    <div class="bar2 xpbar"><i id="p-xp"></i></div>
    <div class="bar2 furybar"><i id="p-fury"></i></div>
  </div>
  <div id="cmd"><span class="army">軍團 <span id="armyn">0</span></span><button class="btn" data-mode="follow">跟隨</button><button class="btn" data-mode="attack">進攻</button><button class="btn" data-mode="defend">守巢</button></div>
  <div id="skills"></div>
  <div id="tc">
    <div id="pad"><div id="knob"></div></div>

    v: 1, t: 60, food: 160, dna: 0, kills: 0, streak: 0, streakT: 0, best: 0, deaths: 0, built: 0,
    queen: { hp: 1200, mhp: 1200 }, nest: { hp: 2500, mhp: 2500 },
    rooms: Array(A.SLOTS).fill(null), research: {}, ratio: { worker: 55, soldier: 45, acid: 0, major: 0, bullet: 0, flyer: 0 }, auto: true, eggs: [],
    mode: 'follow', rallyX: 0, zones: {}, outposts: [], raidT: 170, weather: null, weatherT: 300, msgT: 0, over: null, conquered: 0,

A.newPlayer = () => ({ x: 40, y: 0, vx: 0, vy: 0, face: 1, ground: true, hp: 160, mhp: 160, lv: 1, xp: 0, sp: 0, sk: {}, cds: {}, combo: 0, comboT: 0, atkT: 0, fury: 0, frenzyT: 0, dead: false, respawnT: 0, inNest: false, invT: 0, slam: false, dash: 0, dashV: 0, rallyT: 0, kills: 0, hurtT: 0, lane: 4 });
A.buildWorld = function () {

A.spawnStruct = function (z, hp) {
  const d = A.STRUCTS[z.st];

  S.structs.push({ id: UID++, st: 1, k: z.st, d, x: z.sx, y: d.hang ? -260 : 0, hp: Math.min(mhp, hp || mhp), mhp, zone: z.id, spawnT: 2, alive: 0, w: d.w, h: d.h, latched: 0, turretT: 2 });
};

/* ---------- 計算 ---------- */
A.R = k => S.research[k] | 0;
A.roomCount = k => S.rooms.filter(r => r && r.k === k && r.done).length;
A.mul = () => {
  const arm = A.roomCount('armory') * 0.08, rally = S.player.rallyT > 0 ? 0.3 + 0.05 * (S.player.sk.s_rally | 0) : 0;
  return { atk: 1 + 0.15 * A.R('r_jaw') + arm + rally, hp: 1 + 0.15 * A.R('r_shell') + arm, spd: (1 + 0.08 * A.R('r_legs')) * (rally ? 1.3 : 1) * (S.weather === 'rain' ? 0.8 : 1) };
};
A.foodCap = () => 400 + 600 * A.roomCount('storage');
A.popCap = () => 40 + 15 * A.roomCount('brood') + 40 * A.roomCount('barracks');
A.eggSlots = () => 2 + 2 * A.roomCount('brood');
A.pop = () => S.ants.filter(a => !a.temp).length + S.eggs.length;
A.stage = lv => { let s = A.STAGES[0]; for (const x of A.STAGES) if (lv >= x.lv) s = x; return s; };
A.pStats = () => {
  const P = S.player, st = A.stage(P.lv), fr = P.frenzyT > 0;
  return { atk: (10 + P.lv * 4 + Math.pow(P.lv, 1.35)) * (fr ? 2 : 1), mhp: Math.round(160 + P.lv * 32 + Math.pow(P.lv, 1.7)), spd: (190 + P.lv * 1.5) * (fr ? 1.3 : 1) * (P.rallyT > 0 ? 1.15 : 1), size: st.size * (fr ? 1.2 : 1), reach: 26 * st.size + 18, stage: st };
};
A.unlocked = c => { const u = A.CASTES[c].unlock; return !u || A.R(u) > 0; };
A.territory = () => {
  let lo = A.HOME.x0, hi = A.HOME.x1;
  for (const dir of [-1, 1]) for (const z of A.ZONES.filter(q => q.dir === dir).sort((a, b) => a.i - b.i)) { if (!S.zones[z.id].conq) break; if (dir < 0) lo = z.x0; else hi = z.x1; }
  return [lo, hi];
};
A.depots = () => [{ x: 0, home: 1 }].concat(S.outposts);
A.nearDepot = x => { let best = null; for (const d of A.depots()) if (!best || Math.abs(d.x - x) < Math.abs(best.x - x)) best = d; return best; };

/* ---------- 生成 ---------- */
A.spawnAnt = function (c, x, temp) {
  const C = A.CASTES[c], m = A.mul();
  const a = { id: UID++, ant: 1, c, C, x, y: 0, vx: 0, face: Math.random() < 0.5 ? -1 : 1, hp: C.hp * m.hp, mhp: C.hp * m.hp, st: c === 'worker' ? 'in' : 'fight', tgt: null, cd: U.rand(0, 0.5), carry: 0, at: 0, lane: Math.random() * 12, slot: U.rand(-1, 1), think: Math.random() * 0.3, poison: null, temp: temp || 0, hitT: 0, depot: A.nearDepot(x).x, size: C.size, alt: C.fly ? U.rand(110, 170) : 0 };
  if (temp) { a.hp = a.mhp = 140 + S.player.lv * 12; a.atkB = 10 + S.player.lv * 2.5; a.st = 'fight'; }

};
A.spawnEnemy = function (k, x, o) {
  const d = A.ENEMIES[k], lvl = 1 + (o && o.raid ? S.t / DAY * 0.08 : 0);
  const e = Object.assign({ id: UID++, en: 1, k, d, x, y: d.fly ? -U.rand(140, 260) : 0, vx: 0, vy: 0, face: Math.random() < 0.5 ? -1 : 1, hp: d.hp * lvl, mhp: d.hp * lvl, st: 'wander', tgt: null, cd: U.rand(0.5, 1.5), stun: 0, poison: null, w: d.w * (d.size || 1) / (d.size || 1), h: d.h, home: x, think: 0, shakeT: U.rand(2, 4), latched: 0, aggro: 0, wanderT: 0, hopT: U.rand(1, 3), lane: U.rand(0, 8), hitT: 0, slowT: 0 }, o || {});
  if (d.fly) e.alt0 = -e.y;

A.spawnFood = function (x, k, amt) {
  if (x == null) {
    /* 在各區域隨機生成（越外圍越多） */
    const [lo, hi] = A.territory(), zs = A.ZONES, inner = zs.filter(q => q.x1 > lo - 2900 && q.x0 < hi + 2900), z = Math.random() < 0.4 ? null : U.pick(inner.length ? inner : zs);
    if (!z) { x = U.rand(lo + 100, hi - 100); k = U.pick(['seed', 'leaf', 'crumb']); }
    else { x = U.rand(z.x0 + 100, z.x1 - 100); k = U.pick(z.food); }
  }
  const F = A.FOODS[k];
  const f = { id: UID++, food: 1, x, y: 0, k, amt: amt || F.amt, max: amt || F.amt, claim: 0 };

/* ---------- 主更新 ---------- */
A.update = function (dt) {
  if (S.over) return;
  S.t += dt; S.playTime += dt;
  const P = S.player;
  S._mul = A.mul();
  A.colony(dt);
  A.playerUpdate(dt);
  for (let i = S.ants.length - 1; i >= 0; i--) { const a = S.ants[i]; A.antAI(a, dt); if (a.dead) S.ants.splice(i, 1); }
  for (let i = S.enemies.length - 1; i >= 0; i--) { const e = S.enemies[i]; A.enemyAI(e, dt); if (e.dead) S.enemies.splice(i, 1); }
  for (let i = S.structs.length - 1; i >= 0; i--) { const s = S.structs[i]; A.structAI(s, dt); if (s.dead) S.structs.splice(i, 1); }
  A.projUpdate(dt);
  A.spawner(dt);
  A.raids(dt);
  A.weather(dt);
  if (S.streakT > 0) { S.streakT -= dt; if (S.streakT <= 0) S.streak = 0; }
  if (P.rallyT > 0) P.rallyT -= dt;
  S.foods = S.foods.filter(f => f.amt > 0.5);
};

/* ---------- 蟻群經濟 ---------- */
A.colony = function (dt) {
  /* 被動食物 */
  S.food += (3 * A.roomCount('fungus') + 5 * A.roomCount('aphid')) * dt;
  /* 消耗：每隻螞蟻每秒吃一點 */
  const n = S.ants.filter(a => !a.temp).length;
  S.food -= n * 0.006 * dt;
  if (S.food < 0) {
    S.food = 0; S.starveT -= dt;
    if (S.starveT <= 0 && n > 0) { S.starveT = 3; const v = S.ants.find(a => !a.temp && a.st === 'in') || S.ants.find(a => !a.temp); if (v) { v.dead = 1; ev({ k: 'msg', m: '食物耗盡！有螞蟻餓死了', c: '#ff8a6a' }); } }
  } else S.starveT = 3;
  S.food = Math.min(S.food, A.foodCap());
  /* 巢室建造：工蟻在家才會挖 */
  const diggers = S.ants.filter(a => a.c === 'worker' && a.st === 'in').length;
  for (const r of S.rooms) if (r && !r.done) { r.prog += dt / A.ROOMS[r.k].time * (diggers > 0 ? Math.min(2, 0.5 + diggers * 0.1) : 0.2); if (r.prog >= 1) { r.done = true; r.prog = 1; S.built++; ev({ k: 'msg', m: `${A.ROOMS[r.k].n} 完工了！`, c: '#e8c060' }); ev({ k: 'sfx', s: 'build' }); } }
  /* 蟻后產卵 */
  const spd = (1 + 0.18 * A.R('r_queen'));
  for (const e of S.eggs) e.t += dt * spd;
  for (let i = S.eggs.length - 1; i >= 0; i--) { const e = S.eggs[i]; if (e.t >= e.tot) { S.eggs.splice(i, 1); A.spawnAnt(e.c, U.rand(-20, 20)); ev({ k: 'hatch', c: e.c }); } }
  if (S.auto && S.queen.hp > 0 && S.eggs.length < A.eggSlots() && A.pop() < A.popCap()) {
    const list = A.CASTE_ORDER.filter(c => A.unlocked(c) && S.ratio[c] > 0).map(c => [c, S.ratio[c]]);
    if (list.length) {
      const c = S.nextEgg && A.unlocked(S.nextEgg) ? S.nextEgg : U.wpick(list), C = A.CASTES[c];
      S.nextEgg = c;
      if (S.food >= C.cost + 25 + A.pop() * 0.4) { S.food -= C.cost; S.eggs.push({ c, t: 0, tot: C.time }); S.nextEgg = null; }
    }
  }
  /* 蟻后回復 */
  if (S.nest.hp > 0) S.queen.hp = Math.min(S.queen.mhp, S.queen.hp + 6 * dt);
  S.nest.hp = Math.min(S.nest.mhp, S.nest.hp + 4 * dt);
  for (const o of S.outposts) o.hp = Math.min(o.mhp, o.hp + 3 * dt);
};
A.layEgg = function (c) {
  const C = A.CASTES[c]; if (!A.unlocked(c)) return 'locked';
  if (S.eggs.length >= A.eggSlots()) return 'slots';
  if (A.pop() >= A.popCap()) return 'cap';
  if (S.food < C.cost) return 'food';
  S.food -= C.cost; S.eggs.push({ c, t: 0, tot: C.time }); return 'ok';
};
A.build = function (slot, k) {
  const R = A.ROOMS[k]; if (!R || S.rooms[slot]) return 'used';
  if (R.unlock && !A.R(R.unlock)) return 'locked';
  if (S.food < R.cost) return 'food';
  S.food -= R.cost; S.rooms[slot] = { k, done: false, prog: 0 }; return 'ok';
};
A.rcost = k => Math.round(A.RESEARCH[k].cost(A.R(k)) * 1.6);
A.research = function (k) {
  const R = A.RESEARCH[k], lv = A.R(k); if (!R || lv >= R.max) return 'max';
  if (R.need && !A.R(R.need)) return 'need';
  const c = A.rcost(k); if (S.dna < c) return 'dna';
  S.dna -= c; S.research[k] = lv + 1;
  if (k === 'r_shell' || k === 'r_armory') { const m = A.mul(); for (const a of S.ants) { if (a.temp) continue; const nm = A.CASTES[a.c].hp * m.hp; a.hp = a.hp / a.mhp * nm; a.mhp = nm; } }
  return 'ok';
};

/* ---------- 螞蟻 AI ---------- */
A.antAI = function (a, dt) {
  if (a.hitT > 0) a.hitT -= dt;
  if (a.poison) { a.hp -= a.poison.dps * dt; a.poison.t -= dt; if (a.poison.t <= 0) a.poison = null; if (a.hp <= 0) return A.antDie(a); }
  if (a.temp) { a.temp -= dt; if (a.temp <= 0) { a.dead = 1; ev({ k: 'puff', x: a.x, y: a.y }); return; } }
  if (a.st === 'in') { a.think -= dt; if (a.think <= 0) { a.think = U.rand(0.4, 0.9); A.antDecide(a); } return; }
  const m = S._mul || A.mul(), C = a.C, spd = C.spd * m.spd * (a.temp ? 1.4 : 1);
  if (a.cd > 0) a.cd -= dt;
  a.at = Math.max(0, a.at - dt);
  /* 吸附在大型目標上 */
  if (a.st === 'latch') {
    const t = a.tgt;
    if (!t || t.dead || t.hp <= 0) { a.st = a.c === 'worker' ? 'ret' : 'fight'; a.tgt = null; a.y = 0; return; }
    a.x = t.x + a.ox * t.w * (t.face || 1); a.y = (t.y || 0) - a.oy * t.h;
    if (a.cd <= 0) A.antHit(a, t);
    return;
  }
  /* 從大型生物身上被甩落 */
  if (a.y < 0 && !C.fly) { a.vy = (a.vy || 0) + GRAV * dt; a.y += a.vy * dt; a.x += a.vx * dt; if (a.y >= 0) { a.y = 0; a.vy = 0; a.vx = 0; } return; }
  a.think -= dt;
  if (a.think <= 0) { a.think = U.rand(0.25, 0.4); A.antDecide(a); }
  if (C.role === 'gather' && !a.fighting) return A.workerMove(a, dt, spd);
  /* 戰鬥兵種 */
  const t = a.tgt;
  if (t && !t.dead && t.hp > 0) {
    const reach = (C.range || 8) + (t.w || 30) / 2 + 6 * a.size;
    const dx = t.x - a.x;
    a.face = dx >= 0 ? 1 : -1;
    if (C.fly) {
      const ty = -a.alt; a.y += (ty - a.y) * Math.min(1, dt * 3);
      if (Math.abs(dx) > 20) a.x += Math.sign(dx) * spd * dt; else if (a.cd <= 0) A.antHit(a, t);
      return;
    }
    if (Math.abs(dx) > reach) { a.x += Math.sign(dx) * spd * dt; a.moving = 1; }
    else {
      a.moving = 0;
      if ((t.d.big || t.st === 1) && !C.range && !t.d.fly) { a.st = 'latch'; a.ox = U.clamp((a.x - t.x) / Math.max(1, t.w) * (t.face || 1), -0.46, 0.46) * U.rand(0.4, 1); a.oy = Math.random() < 0.35 ? U.rand(0, 0.12) : U.rand(0.12, 0.9); t.latched = (t.latched || 0) + 1; return; }
      if (a.cd <= 0) A.antHit(a, t);
    }
    return;
  }
  /* 沒有目標：依軍團指令移動 */
  const P = S.player;
  let anchor = S.mode === 'follow' || P.rallyT > 0 ? (P.dead ? 0 : P.x) : S.mode === 'attack' ? S.rallyX : A.nearDepot(a.x).x;
  if (a.temp) anchor = a.x + a.face * 200;
  const want = anchor + a.slot * (S.mode === 'follow' ? 110 + Math.sqrt(S.ants.length) * 4 : 160) - (S.mode === 'follow' && !a.temp ? P.face * 40 : 0);
  if (C.fly) { const ty = -a.alt; a.y += (ty - a.y) * Math.min(1, dt * 2); }
  const dx = want - a.x;
  if (Math.abs(dx) > 14) { a.face = Math.sign(dx); a.x += a.face * Math.min(Math.abs(dx), spd * (Math.abs(dx) > 300 ? 1.15 : 0.8) * dt); a.moving = 1; } else a.moving = 0;
};
A.antDecide = function (a) {
  const C = a.C, P = S.player;
  if (C.role === 'gather') {
    /* 有敵人在身邊才反擊 */
    const e = A.nearestFoe(a.x, 70, true);
    if (e && a.st !== 'in') { a.fighting = 1; a.tgt = e; a.st = 'fight'; return; }
    if (a.fighting) { a.fighting = 0; a.st = a.carry ? 'ret' : 'go'; a.tgt = null; }
    if (a.st === 'in') {
      const f = A.findFood(a); if (f) { a.st = 'go'; a.tgt = f; f.claim++; a.x = a.depot; a.y = 0; }
    }
    return;
  }
  if (a.st === 'latch') return;
  const anchor = a.temp ? a.x : S.mode === 'follow' || P.rallyT > 0 ? P.x : S.mode === 'attack' ? S.rallyX : A.nearDepot(a.x).x;
  const range = a.temp ? 420 : S.mode === 'defend' ? 450 : 340;
  let best = null, bd = 1e9;
  const consider = (e) => { if (e.dead || e.hp <= 0) return; const ex = e.x; if (Math.abs(ex - anchor) > range && Math.abs(ex - a.x) > 200) return; if (e.en && e.d.team === 'prey' && !e.aggro && S.mode === 'defend') return; if (a.C.fly === undefined && e.en && e.d.fly && !e.st2land && e.y < -160) return; const d = Math.abs(ex - a.x) + (e.latched || 0) * 4; if (d < bd) { bd = d; best = e; } };
  for (const e of S.enemies) consider(e);
  for (const s of S.structs) consider(s);
  a.tgt = best;
};
A.findFood = function (a) {
  const [lo, hi] = A.territory(), P = S.player;
  let best = null, bd = 1e9;
  for (const f of S.foods) {
    if (f.claim * (8 + 3 * A.R('r_carry')) >= f.amt) continue;
    const inT = f.x > lo - 500 && f.x < hi + 500, nearP = !P.dead && Math.abs(f.x - P.x) < 600;
    if (!inT && !nearP) continue;
    const d = Math.abs(f.x - a.depot) - (f.meat ? 600 : 0);
    if (d < bd) { bd = d; best = f; }
  }
  return best;
};
A.workerMove = function (a, dt, spd) {
  if (a.st === 'go') {
    const f = a.tgt;
    if (!f || f.amt <= 0.5) { if (f) f.claim = Math.max(0, f.claim - 1); a.tgt = A.findFood(a); if (a.tgt) a.tgt.claim++; else { a.st = 'ret'; } return; }
    const dx = f.x - a.x; a.face = Math.sign(dx) || 1;
    if (Math.abs(dx) > 8) { a.x += a.face * spd * dt; a.moving = 1; }
    else { const take = Math.min(f.amt, 8 + 3 * A.R('r_carry')); f.amt -= take; f.claim = Math.max(0, f.claim - 1); a.carry = take; a.carryK = f.k; a.st = 'ret'; a.tgt = null; }
  } else if (a.st === 'ret') {
    const d = A.nearDepot(a.x); a.depot = d.x;
    const dx = d.x - a.x; a.face = Math.sign(dx) || 1;
    if (Math.abs(dx) > 10) { a.x += a.face * spd * (a.carry ? 0.85 : 1) * dt; a.moving = 1; }
    else { if (a.carry) { S.food = Math.min(A.foodCap(), S.food + a.carry); S.foodIn = (S.foodIn || 0) + a.carry; } a.carry = 0; a.st = 'in'; a.moving = 0; a.think = U.rand(0.2, 0.8); }
  } else if (a.st === 'fight') {
    const t = a.tgt; if (!t || t.dead || t.hp <= 0) { a.fighting = 0; a.st = a.carry ? 'ret' : 'go'; a.tgt = null; return; }
    const dx = t.x - a.x; a.face = Math.sign(dx) || 1;
    if (Math.abs(dx) > (t.w || 20) / 2 + 6) a.x += a.face * spd * dt; else if (a.cd <= 0) A.antHit(a, t);
  }
};
A.nearestFoe = function (x, r, hostileOnly) {
  let best = null, bd = r;
  for (const e of S.enemies) { if (e.dead) continue; if (hostileOnly && e.d.team === 'prey' && !e.aggro) continue; if (e.d.fly && e.y < -100) continue; const d = Math.abs(e.x - x); if (d < bd) { bd = d; best = e; } }
  return best;
};
A.antHit = function (a, t) {
  const C = a.C, m = S._mul || A.mul();
  a.cd = C.cd * U.rand(0.85, 1.15); a.at = 0.25;
  let dmg = (a.atkB || C.atk) * m.atk;
  if (C.range) { S.projs.push({ k: 'acid', x: a.x, y: a.y - 8, tx: t.x, ty: (t.y || 0) - (t.h || 20) * 0.5, t: 0, dur: 0.35, dmg, tgt: t, team: 0 }); return; }
  if (C.fly) { S.projs.push({ k: 'bomb', x: a.x, y: a.y, vx: 0, vy: 80, t: 0, dmg, aoe: C.aoe, team: 0 }); return; }
  A.damage(t, dmg, { src: a, small: 1, stun: C.stun });
};

/* ---------- 傷害與死亡 ---------- */
A.damage = function (t, dmg, o) {
  o = o || {};
  if (!t || t.dead || t.hp <= 0) return 0;
  if (t.ant || t === S.player) return A.hurtAnt(t, dmg, o);
  const d = t.d;
  if (t.st === 1 || d.boss) dmg *= 1 + 0.25 * A.R('r_siege');
  if (t.st === 1) { if (o.player) dmg *= 0.5; else if (o.src && o.src.c === 'major') dmg *= 1.4; else if (o.small) dmg *= 0.55; }
  if (d.armor) dmg *= 1 - d.armor * (o.pierce ? 0.3 : 1);
  let crit = false;
  if (o.player && Math.random() < 0.15 + (S.player.frenzyT > 0 ? 0.2 : 0)) { dmg *= 1.8; crit = true; }
  dmg = Math.max(1, Math.round(dmg));
  t.hp -= dmg; t.hitT = 0.12;

/* ---------- 敵襲 ---------- */
A.raids = function (dt) {

  const cands = [];

  if (!picks.length) picks.push(pool.slice().sort((a, b) => A.ENEMIES[a[0]].hp - A.ENEMIES[b[0]].hp)[0][0]);
  for (const k of picks) { A.spawnEnemy(k, sx + z.dir * U.rand(0, 300), { raid: 1, raidTgt: tgt.home ? { x: 0, isDepot: 1, home: 1, d: {}, w: 60, h: 40 } : Object.assign(tgt, { isDepot: 1, d: {}, w: 60, h: 40 }), zone: z.id, aggro: 99 }); }
  ev({ k: 'raid', m: `敵襲！${z.n}的 ${picks.length} 隻生物正在進攻${tgt.home ? '巢穴' : '前哨'}！`, dir: z.dir, x: tgt.x });
};

/* ---------- 天氣與晝夜 ---------- */
A.dayPhase = () => (S.t % DAY) / DAY; /* 0 清晨 … 0.5 黃昏 … */
A.night = () => { const p = A.dayPhase(); return p > 0.62 && p < 0.95; };
A.weather = function (dt) {
  S.weatherT -= dt;
  if (S.weatherT <= 0) {
    if (S.weather) { S.weather = null; S.weatherT = U.rand(200, 360); ev({ k: 'msg', m: '雨停了。', c: '#a8d0ff' }); }
    else { S.weather = 'rain'; S.weatherT = U.rand(40, 70); ev({ k: 'msg', m: '下雨了！地面上的螞蟻行動變慢。', c: '#a8d0ff' }); }
  }
};

/* ---------- 投射物 ---------- */
A.projUpdate = function (dt) {
  for (let i = S.projs.length - 1; i >= 0; i--) {
    const p = S.projs[i]; p.t += dt;
    if (p.k === 'bomb') { p.vy += GRAV * 0.6 * dt; p.y += p.vy * dt; if (p.y >= 0) { A.aoe(p.x, p.aoe, p.dmg, 0, { small: 1 }); ev({ k: 'boom', x: p.x, r: p.aoe, acid: 1 }); S.projs.splice(i, 1); } continue; }
    if (p.k === 'wave') { p.x += p.vx * dt; for (const e of S.enemies.concat(S.structs)) if (!p.hit.has(e.id) && Math.abs(e.x - p.x) < (e.w || 40) / 2 + 30 && (e.y || 0) > -200) { p.hit.add(e.id); A.damage(e, p.dmg, { player: 1, stun: 1.2 }); } if (p.t > p.dur) S.projs.splice(i, 1); continue; }
    if (p.t >= p.dur) {
      if (p.k === 'shell') { A.aoe(p.tx, p.aoe, p.dmg, 1, {}); ev({ k: 'boom', x: p.tx, r: p.aoe }); ev({ k: 'shake', v: 8 }); }
      else if (p.tgt && !p.tgt.dead) {
        if (p.k === 'web') { if (p.tgt === S.player) { A.damage(S.player, p.dmg, {}); S.player.slowT = 2; } else if (p.tgt.isDepot) A.hitDepot(p.tgt, p.dmg); else A.hurtAnt(p.tgt, p.dmg, {}); }
        else A.damage(p.tgt, p.dmg, { small: 1 });
        if (p.k === 'acid' && p.tgt.en) p.tgt.slowT = 1;

};
A.aoe = function (x, r, dmg, team, o) {
  if (team === 1) {
    for (const a of S.ants) if (a.st !== 'in' && Math.abs(a.x - x) < r && a.y > -150) A.hurtAnt(a, dmg * (a.st === 'latch' ? 0.4 : 1), { fling: 1 });
    const P = S.player; if (!P.dead && Math.abs(P.x - x) < r && P.y > -150) A.damage(P, dmg * 0.5, { kb: (P.x > x ? 1 : -1) * 400 });
    for (const dp of S.outposts) if (Math.abs(dp.x - x) < r) A.hitDepot(dp, dmg);
    if (Math.abs(x) < r) A.hitDepot({ home: 1 }, dmg * 0.5);
  } else {
    for (const e of S.enemies.concat(S.structs)) if (Math.abs(e.x - x) < r + (e.w || 0) / 2 && (e.y || 0) > -300) A.damage(e, dmg, o);
  }
};

/* ---------- 玩家 ---------- */
A.input = { l: 0, r: 0, u: 0, d: 0, jump: 0, atk: 0 };
A.playerUpdate = function (dt) {
  const P = S.player, I = A.input, st = A.pStats();
  if (P.dead) { P.respawnT -= dt; if (P.respawnT <= 0) { P.dead = false; P.hp = st.mhp; P.x = 40; P.y = 0; P.vx = 0; P.vy = 0; P.inNest = false; ev({ k: 'respawn' }); } return; }
  P.mhp = st.mhp; if (P.hp > P.mhp) P.hp = P.mhp;
  for (const k in P.cds) if (P.cds[k] > 0) P.cds[k] -= dt;
  if (P.invT > 0) P.invT -= dt; if (P.hurtT > 0) P.hurtT -= dt; if (P.slowT > 0) P.slowT -= dt;
  if (P.frenzyT > 0) { P.frenzyT -= dt; if (P.frenzyT <= 0) ev({ k: 'msg', m: '狂暴結束', c: '#ffb08a' }); }
  if (P.comboT > 0) { P.comboT -= dt; if (P.comboT <= 0) P.combo = 0; }
  if (P.atkT > 0) P.atkT -= dt;
  /* 自然回復（在巢內很快） */
  P.hp = Math.min(P.mhp, P.hp + P.mhp * (P.inNest ? 0.08 : 0.006) * dt);
  /* 巢穴內：上下爬行 */
  if (P.inNest) {
    if (I.u) { P.y -= 260 * dt; if (P.y <= 0) { P.y = 0; P.inNest = false; ev({ k: 'nest', in: 0 }); } }
    if (I.d) P.y = Math.min(A.NEST_DEPTH, P.y + 260 * dt);
    P.x = 0; P.vx = 0; return;
  }
  if (P.dash > 0) {
    P.dash -= dt; const nx = P.x + P.dashV * dt;
    for (const e of S.enemies.concat(S.structs)) if (!P.dashHit.has(e.id) && (e.x - P.x) * Math.sign(P.dashV) > -20 && (e.x - nx) * Math.sign(P.dashV) < 30 && (e.y || 0) > -e.h - 80) { P.dashHit.add(e.id); A.damage(e, st.atk * (2 + 0.4 * (P.sk.s_dash | 0)), { player: 1, stun: 0.4 }); }

  }

  else P.vx = U.lerp(P.vx, 0, Math.min(1, dt * (P.ground ? 16 : 3)));
  if (I.jump && P.ground) { P.vy = -620 - st.size * 40; P.ground = false; I.jump = 0; ev({ k: 'jump' }); }
  if (!P.ground) { P.vy += GRAV * dt; }
  P.x += P.vx * dt; P.y += P.vy * dt;

    P.y = 0; P.vy = 0; P.ground = true;
  }
  P.x = U.clamp(P.x, A.WORLD.x0, A.WORLD.x1);
  /* 進入巢穴 */
  if (I.d && P.ground && Math.abs(P.x) < 40) { P.inNest = true; P.y = 20; ev({ k: 'nest', in: 1 }); }
  if (I.atk) A.pAttack();
};
A.pAttack = function () {
  const P = S.player; if (P.dead || P.inNest || P.atkT > 0.05) return;
  const st = A.pStats();

  P.atkT = P.combo === 3 ? 0.36 : 0.26;
  const reach = st.reach * (P.combo === 3 ? 1.5 : 1.15);
  const mult = P.combo === 3 ? 2.2 : 1;
  let n = 0, hitBig = false;
  const tgts = S.enemies.concat(S.structs).filter(e => !e.dead && (e.x - P.x) * P.face > -e.w / 2 - 10 && Math.abs(e.x - P.x) - e.w / 2 < reach && (e.y || 0) > P.y - e.h - 60 - 30 * st.size && (e.y || 0) - e.h < P.y + 40).sort((a, b) => Math.abs(a.x - P.x) - Math.abs(b.x - P.x));
  for (const e of tgts) {
    if (n >= (P.combo === 3 ? 6 : 3)) break; n++;
    const dmg = A.damage(e, st.atk * mult * U.rand(0.9, 1.1), { player: 1, stun: P.combo === 3 ? 0.35 : 0.08 });
    if (e.en && !e.d.big && !e.dead) { e.vy = -U.rand(150, 300) * (P.combo === 3 ? 1.8 : 1); e.x += P.face * 18 * (P.combo === 3 ? 3 : 1); if (!e.d.fly) e.y = Math.min(e.y, -1); }
    if (e.d && e.d.big) hitBig = true; void dmg;
  }

};
A.useSkill = function (k) {
  const P = S.player; if (P.dead || P.inNest) return 'dead';
  const lv = P.sk[k] | 0; if (!lv) return 'locked';
  if (P.cds[k] > 0) return 'cd';
  const sk = A.SKILLS[k], st = A.pStats();
  P.cds[k] = sk.cd * (k === 's_rally' || k === 's_swarm' ? 1 - 0.06 * lv : 1);
  const F = P.face;
  switch (k) {
    case 's_acid': {
      const r = 200 + 30 * st.size + lv * 15;
      for (const e of S.enemies.concat(S.structs)) if (!e.dead && (e.x - P.x) * F > -20 && Math.abs(e.x - P.x) - (e.w || 0) / 2 < r && (e.y || 0) > -e.h - 200) { A.damage(e, st.atk * (0.8 + 0.2 * lv), { player: 1 }); if (e.en) { e.poison = { dps: st.atk * (0.5 + 0.18 * lv), t: 4 }; e.slowT = 2; } }
      ev({ k: 'acidspray', x: P.x + F * 20 * st.size, y: P.y - 14 * st.size, face: F, r });
      break;
    }
    case 's_dash': P.dash = 0.24; P.dashV = F * (1500 + lv * 80); P.dashHit = new Set(); ev({ k: 'dash', x: P.x, face: F }); break;
    case 's_slam': if (P.ground) { P.vy = -760; P.ground = false; } P.slam = true; P.vy = Math.max(P.vy, -200) - 300; ev({ k: 'slamup' }); break;
    case 's_rally': P.rallyT = 12; for (const a of S.ants) if (!a.temp && a.st !== 'in' && a.C.role !== 'gather') { a.tgt = null; if (a.st === 'latch') { a.st = 'fight'; } } ev({ k: 'rally', x: P.x, y: P.y }); break;
    case 's_devour': {
      const reach = st.reach * 1.8;
      const e = S.enemies.filter(q => !q.dead && Math.abs(q.x - P.x) - q.w / 2 < reach && (q.x - P.x) * F > -q.w / 2 - 20 && q.hp / q.mhp < (q.d.boss ? 0.1 + lv * 0.01 : 0.3 + lv * 0.03)).sort((a, b) => b.mhp - a.mhp)[0];
      if (!e) { P.cds[k] = 0; return 'none'; }
      A.damage(e, e.hp + 1, { player: 1, devour: 1 }); A.kill(e, { player: 1, devour: 1 });
      P.hp = Math.min(st.mhp, P.hp + st.mhp * (0.2 + 0.04 * lv)); S.food = Math.min(A.foodCap(), S.food + e.d.food * 0.5);
      ev({ k: 'devour', x: e.x, y: (e.y || 0) - e.h * 0.5, w: e.w, h: e.h, blood: e.d.blood }); ev({ k: 'slowmo', t: 0.5 }); ev({ k: 'shake', v: 10 });
      break;
    }
    case 's_swarm': { const n = 14 + lv * 5; for (let i = 0; i < n; i++) { const a = A.spawnAnt('soldier', P.x + F * U.rand(20, 160), 9 + lv); a.face = F; a.swarm = 1; a.y = 0; } ev({ k: 'swarm', x: P.x + F * 80 }); break; }
    case 's_quake': S.projs.push({ k: 'wave', x: P.x + F * 30, vx: F * 1100, t: 0, dur: 0.6 + lv * 0.04, dmg: st.atk * (4 + lv), hit: new Set(), team: 0 }); ev({ k: 'quake', x: P.x, face: F }); ev({ k: 'shake', v: 12 }); break;
  }
  return 'ok';
};
A.slamLand = function () {
  const P = S.player, st = A.pStats(), lv = P.sk.s_slam | 1;
  P.slam = false;
  const r = 150 + 20 * lv + 20 * st.size;
  for (const e of S.enemies.concat(S.structs)) if (!e.dead && Math.abs(e.x - P.x) - (e.w || 0) / 2 < r && (e.y || 0) > -e.h - 100) { A.damage(e, st.atk * (2.5 + 0.5 * lv), { player: 1, stun: 1.5 }); if (e.en && !e.d.big) { e.vy = -500; e.y = Math.min(-1, e.y); } }
  ev({ k: 'slam', x: P.x, r }); ev({ k: 'shake', v: 14 }); ev({ k: 'hitstop', t: 0.08 });
};
A.frenzy = function () { const P = S.player; if (P.fury < 100 || P.dead || P.frenzyT > 0) return; P.fury = 0; P.frenzyT = 12; ev({ k: 'frenzy' }); ev({ k: 'slowmo', t: 0.4 }); };
A.playerDie = function () {
  const P = S.player; P.dead = true; P.respawnT = 6; P.hp = 0; P.fury = 0; P.frenzyT = 0; S.streak = 0;
  ev({ k: 'pdie', x: P.x, y: P.y });
};
A.learn = function (k) { const P = S.player, s = A.SKILLS[k]; if (!s || P.sp <= 0 || P.lv < s.lv || (P.sk[k] | 0) >= s.max) return false; P.sk[k] = (P.sk[k] | 0) + 1; P.sp--; return true; };
A.NEST_DEPTH = 560;

/* ---------- 結局 ---------- */
A.gameOver = function (win) { if (S.over) return; S.over = win ? 'win' : 'lose'; ev({ k: 'over', win }); };

/* ---------- 存檔 ---------- */
A.SAVE_KEY = 'ant_empire_v1';
A.save = function () {
  if (!S.player) return false;
  const counts = {}; for (const a of S.ants) if (!a.temp) counts[a.c] = (counts[a.c] || 0) + 1;
  const P = S.player;
  const data = { v: 1, at: Date.now(), t: S.t, food: S.food, dna: S.dna, kills: S.kills, best: S.best, deaths: S.deaths, built: S.built, playTime: S.playTime, queen: S.queen, nest: S.nest, rooms: S.rooms, research: S.research, ratio: S.ratio, auto: S.auto, eggs: S.eggs, mode: S.mode, zones: S.zones, outposts: S.outposts.map(o => ({ x: o.x, zone: o.zone, hp: o.hp, mhp: o.mhp })), counts, conquered: S.conquered, over: S.over,
    player: { lv: P.lv, xp: P.xp, sp: P.sp, sk: P.sk, hp: P.hp, fury: P.fury } };
  try { const prev = localStorage.getItem(A.SAVE_KEY); if (prev) localStorage.setItem(A.SAVE_KEY + '_bak', prev); localStorage.setItem(A.SAVE_KEY, JSON.stringify(data)); return true; } catch (e) { return false; }
};
A.hasSave = function () { try { return !!JSON.parse(localStorage.getItem(A.SAVE_KEY)); } catch (e) { return false; } };
A.load = function () {
  let d = null;
  for (const k of [A.SAVE_KEY, A.SAVE_KEY + '_bak']) { try { d = JSON.parse(localStorage.getItem(k)); } catch (e) { d = null; } if (d && d.player) break; }
  if (!d || !d.player) return false;
  A.newGame();
  Object.assign(S, { t: d.t, food: d.food, dna: d.dna, kills: d.kills, best: d.best, deaths: d.deaths, built: d.built || 0, playTime: d.playTime || 0, queen: d.queen, nest: d.nest, rooms: d.rooms, research: d.research, ratio: Object.assign(S.ratio, d.ratio), auto: d.auto !== false, eggs: d.eggs || [], mode: d.mode || 'follow', zones: Object.assign(S.zones, d.zones), outposts: d.outposts || [], conquered: d.conquered || 0, over: null, ants: [], enemies: [], foods: [] });
  Object.assign(S.player, d.player); S.player.hp = Math.max(1, S.player.hp);
  A.buildWorld();
  for (const c in d.counts) for (let i = 0; i < d.counts[c]; i++) { const dep = U.pick(A.depots()); A.spawnAnt(c, dep.x + U.rand(-80, 80)); }
  return true;
};
A.wipe = function () { try { localStorage.removeItem(A.SAVE_KEY); } catch (e) { /* 略過 */ } };
})();

<script>
/* 模組 3／5：美術 — 螞蟻（快取成精靈圖）、所有敵人與人類、據點、食物與屍體、各區域背景、地底巢穴剖面（全部程式繪製，原創造型） */
(function () {

/* ======================= 螞蟻 ======================= */
/* 側面：朝右、原點在腳底中央。L＝身長 */
R.antShape = function (c, L, col, ph, o) {

/* ---------- 鏡頭 ---------- */

  const c = cv.getContext('2d'); c.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = r.width, H = r.height, x0 = A.WORLD.x0, x1 = A.WORLD.x1, X = x => (x - x0) / (x1 - x0) * W;
  c.clearRect(0, 0, W, H);
  const by = 14, bh = H - 26;
  /* 區段 */
  const seg = (a, b, col, name, conq) => {
    c.fillStyle = col; c.fillRect(X(a) + 1, by, X(b) - X(a) - 2, bh);
    if (conq) { c.fillStyle = 'rgba(255,240,200,0.18)'; for (let x = X(a) + 4; x < X(b) - 4; x += 7) c.fillRect(x, by, 2, bh); }
    c.fillStyle = conq ? '#2a1404' : 'rgba(255,240,220,0.85)'; c.font = `700 ${Math.max(9, Math.min(12, (X(b) - X(a)) / 6))}px "Noto Sans TC",sans-serif`; c.textAlign = 'center'; c.textBaseline = 'middle';
    c.fillText(name, (X(a) + X(b)) / 2, by + bh / 2);
  };
  seg(A.HOME.x0, A.HOME.x1, '#7aa848', '蟻巢', false);
  for (const z of A.ZONES) { const conq = S.zones[z.id].conq; seg(z.x0, z.x1, conq ? '#e8a33d' : ['#5a4a3a', '#6a4430', '#7a3a26', '#8a2e1c', '#9a1e10'][z.danger - 1], z.n.length > 4 ? z.n.slice(0, 4) : z.n, conq); }
  /* 軍團分布 */
  const bins = new Map(); for (const a of S.ants) { if (a.st === 'in') continue; const k = Math.round(X(a.x) / 4); bins.set(k, (bins.get(k) || 0) + 1); }
  c.fillStyle = '#2a1408'; for (const [k, n] of bins) { const hh = Math.min(10, 2 + n * 0.6); c.fillRect(k * 4 - 1.5, by + bh + 2, 3, hh); }
  /* 敵人 */
  for (const e of S.enemies) if (e.raid || e.d.boss) { c.fillStyle = e.d.boss ? '#ff2a10' : '#ff6a4a'; c.beginPath(); c.arc(X(e.x), by - 5, e.d.boss ? 4 : 2.2, 0, Math.PI * 2); c.fill(); }
  for (const s of S.structs) { const x = X(s.x); c.fillStyle = '#1a0a04'; c.fillRect(x - 4, by + 3, 8, 7); c.fillRect(x - 5, by + 1, 2, 3); c.fillRect(x + 3, by + 1, 2, 3); c.fillStyle = '#ff6a3a'; c.fillRect(x - 4, by + bh - 4, 8 * s.hp / s.mhp, 2); }
  for (const o of S.outposts) { const x = X(o.x); c.fillStyle = '#2a1404'; c.fillRect(x - 0.5, by - 2, 1.5, 9); c.fillStyle = '#fff2b0'; c.fillRect(x + 1, by - 2, 5, 3); }
  if (S.mode === 'attack') { const x = X(S.rallyX); c.strokeStyle = '#fff'; c.lineWidth = 2; c.beginPath(); c.moveTo(x, by - 6); c.lineTo(x, by + bh + 6); c.stroke(); c.fillStyle = '#fff'; c.font = '900 10px sans-serif'; c.fillText('⚑', x + 6, by - 4); }
  /* 玩家 */
  const P = S.player; const px = X(P.dead ? 0 : P.x);
  c.fillStyle = '#ffd86a'; c.strokeStyle = '#1a0a04'; c.lineWidth = 1.5; c.beginPath(); c.moveTo(px, by + bh + 1); c.lineTo(px - 6, by + bh + 10); c.lineTo(px + 6, by + bh + 10); c.closePath(); c.fill(); c.stroke();
  /* 畫面範圍 */
  const vw = G.W / G.cam.z; c.strokeStyle = 'rgba(255,255,255,0.55)'; c.lineWidth = 1; c.strokeRect(X(G.cam.x - vw / 2), by - 1, X(G.cam.x + vw / 2) - X(G.cam.x - vw / 2), bh + 2);
  c.textBaseline = 'alphabetic';
  UI._ribX = (cx) => x0 + (cx - r.left) / W * (x1 - x0);
};

      case 'Escape': UI.open ? UI.closePanel() : UI.openPanel('menu'); break;
      case 'Equal': case 'NumpadAdd': G.cam.uz = U.clamp(G.cam.uz * 1.15, 0.5, 1.8); break;
      case 'Minus': case 'NumpadSubtract': G.cam.uz = U.clamp(G.cam.uz / 1.15, 0.5, 1.8); break;
      default: return;
    }
    e.preventDefault();
  });
  addEventListener('keyup', e => { const k = KEY[e.code]; if (k) { A.input[k] = 0; if (k === 'jump') A.input.u = 0; } });
  addEventListener('blur', () => { for (const k in A.input) A.input[k] = 0; });
  addEventListener('wheel', e => { if (UI.title || UI.open) return; G.cam.uz = U.clamp(G.cam.uz * (e.deltaY > 0 ? 0.92 : 1.08), 0.5, 1.8); }, { passive: true });
};
UI.setMode = function (m) {
  S.mode = m; const P = S.player;
  if (m === 'attack') { /* 預設往面向的最近未征服據點 */ const st = S.structs.filter(s => Math.sign(s.x - P.x) === P.face || Math.abs(s.x - P.x) < 300).sort((a, b) => Math.abs(a.x - P.x) - Math.abs(b.x - P.x))[0]; S.rallyX = st ? st.x : P.x + P.face * 1500; }
  for (const a of S.ants) if (a.C.role !== 'gather') a.tgt = null;
  UI.log({ follow: '軍團：跟隨你行動', attack: '軍團：向集結點進攻（點上方領土圖可以改位置）', defend: '軍團：回防巢穴與前哨' }[m], '#ffe8b0'); Snd.sfx('tap');
};
UI.touch = function () {
  const pad = $('#pad'), knob = $('#knob'); let pid = null, cx = 0, cy = 0;
  const set = (dx, dy) => { const L = Math.hypot(dx, dy), k = L > 44 ? 44 / L : 1; knob.style.transform = `translate(${dx * k}px,${dy * k}px)`; const I = A.input; I.l = dx < -16 ? 1 : 0; I.r = dx > 16 ? 1 : 0; const up = dy < -30 && Math.abs(dy) > Math.abs(dx) * 0.8; if (up && !UI._padUp) I.jump = 1; UI._padUp = up; I.u = up ? 1 : 0; I.d = dy > 30 && Math.abs(dy) > Math.abs(dx) * 0.8 ? 1 : 0; };
  pad.addEventListener('pointerdown', e => { e.preventDefault(); pid = e.pointerId; pad.setPointerCapture(pid); const r = pad.getBoundingClientRect(); cx = r.left + r.width / 2; cy = r.top + r.height / 2; set(e.clientX - cx, e.clientY - cy); Snd.init(); });
  pad.addEventListener('pointermove', e => { if (e.pointerId === pid) set(e.clientX - cx, e.clientY - cy); });
  const up = e => { if (e.pointerId !== pid) return; pid = null; knob.style.transform = ''; Object.assign(A.input, { l: 0, r: 0, u: 0, d: 0 }); UI._padUp = false; };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  const hold = (sel, key) => { const b = $(sel); const on = e => { e.preventDefault(); b.setPointerCapture(e.pointerId); A.input[key] = 1; b.classList.add('on'); Snd.init(); }; const off = () => { A.input[key] = 0; b.classList.remove('on'); }; b.addEventListener('pointerdown', on); b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('lostpointercapture', off); };
  hold('#t-atk', 'atk'); hold('#t-jump', 'jump');
};

/* ---------- 啟動 ---------- */
UI.init = function () {
  const cv = $('#cv'), ctx = cv.getContext('2d');
  const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window; if (isTouch) document.body.classList.add('touch');
  const resize = () => { const dpr = Math.min(devicePixelRatio || 1, 2); G.W = innerWidth; G.H = innerHeight; G.dpr = dpr; cv.width = Math.round(G.W * dpr); cv.height = Math.round(G.H * dpr); R.sprites.clear(); };
  resize(); addEventListener('resize', resize);
  R.buildDecor();
  UI.keys(); UI.touch();
  $('#t-new').onclick = () => { if (A.hasSave() && !$('#t-cont').hidden) { if (!confirm('開始新遊戲會覆蓋目前的存檔，確定嗎？')) return; } UI.start(false); };
  $('#t-cont').onclick = () => UI.start(true);
  $('#t-help').onclick = () => { $('#t-helpbox').hidden = !$('#t-helpbox').hidden; };
  $('#o-new').onclick = () => UI.start(false);
  $('#o-cont').onclick = () => { $('#over').hidden = true; S.over = null; UI.save(); };
  $('#b-panel').onclick = () => (UI.open ? UI.closePanel() : UI.openPanel('nest'));
  $('#b-menu').onclick = () => UI.openPanel('menu');
  $('#pclose').onclick = () => UI.closePanel();
  document.querySelectorAll('#ptabs button').forEach(b => { b.onclick = () => { UI.tab = b.dataset.tab; UI.pickSlot = null; document.querySelectorAll('#ptabs button').forEach(x => x.classList.toggle('on', x === b)); UI.renderPanel(); Snd.sfx('tap'); }; });
  document.querySelectorAll('[data-mode]').forEach(b => { b.onclick = () => UI.setMode(b.dataset.mode); });
  $('#ribbon').addEventListener('pointerdown', e => { if (!UI._ribX) return; S.rallyX = U.clamp(UI._ribX(e.clientX), A.WORLD.x0 + 200, A.WORLD.x1 - 200); if (S.mode !== 'attack') { S.mode = 'attack'; } for (const a of S.ants) if (a.C.role !== 'gather') a.tgt = null; UI.log('軍團集結點已設定', '#ffe8b0'); Snd.sfx('tap'); });
  addEventListener('pagehide', () => { if (!UI.title && !S.over) A.save(); });
  document.addEventListener('visibilitychange', () => { if (document.hidden && !UI.title && !S.over) A.save(); });
  document.addEventListener('pointerdown', () => Snd.init(), { once: true });
  UI.showTitle();
  let last = performance.now(), hudT = 0, saveT = 0;
  const frame = now => {
    requestAnimationFrame(frame);
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    if (UI.title) { G.t += dt; G.cam.x = Math.sin(G.t * 0.05) * 600; G.cam.y = -G.H * 0.17 / G.cam.z; G.cam.z = U.clamp(G.H / 560, 0.55, 1.5); A.ev.length = 0; }
    else {
      if (!UI.open) G.step(dt); else { for (const e of A.ev) G.handle(e); A.ev.length = 0; }
      G.camera(dt);
      hudT -= dt; if (hudT <= 0) { hudT = 0.12; UI.hud(); UI.ribbon(); }
      saveT += dt; if (saveT > 30 && !S.over) { saveT = 0; UI.save(); }
    }
    ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
    G.render(ctx);
  };
  requestAnimationFrame(frame);
};
addEventListener('DOMContentLoaded', UI.init);
})();

</script>
</body>
</html>
